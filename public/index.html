<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ortopoly</title>
  <meta name="description" content="Ortopoly: juego de bienes raíces multijugador en tiempo real para 3 a 8 jugadores.">
  <meta name="theme-color" content="#e8553e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8553e'/%3E%3Cpath d='M18 46V28l14-10 14 10v18H36V36h-8v10z' fill='%23fffaf2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.min.js" defer></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Ortopoly, inicio">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="28" height="28"><rect width="64" height="64" rx="14" fill="currentColor"/><path d="M18 46V28l14-10 14 10v18H36V36h-8v10z" fill="var(--surface)"/></svg>
      </span>
      <span class="brand-name">Ortopoly</span>
    </a>
    <div class="topbar-info" id="topbar-info"></div>
    <div class="topbar-actions">
      <span class="conn" id="conn-status" role="status" aria-live="polite"></span>
      <select id="lang-select" class="icon-select" aria-label="Idioma">
        <option value="es">ES</option>
        <option value="en">EN</option>
      </select>
      <button class="icon-btn" id="sound-toggle" type="button" aria-pressed="false" aria-label="Silenciar sonido">🔊</button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">Ortopoly necesita JavaScript para funcionar.</p></noscript>
</body>
</html>
